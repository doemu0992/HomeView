<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeView Mockup</title>
<style>
:root{
  --ink:#fff; --ink-2:rgba(255,255,255,.62); --ink-3:rgba(255,255,255,.38);
  --glass:rgba(255,255,255,.14); --glass-on:rgba(255,255,255,.92);
  --on-ink:#1c1c1e; --amber:#ffb340; --blue:#4aa3ff; --green:#34d399; --red:#ff6961;
  --r-lg:30px; --r-md:22px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:#0d0e12; color:var(--ink);
  font-family:-apple-system,"SF Pro Display","Inter","Helvetica Neue",system-ui,sans-serif;
  display:grid; place-items:center; padding:24px; -webkit-font-smoothing:antialiased;
}
/* Gerät: quadratisches Display mit dünnem Rahmen */
.device{
  width:min(92vmin,820px); aspect-ratio:1/1; padding:14px; border-radius:64px;
  background:linear-gradient(145deg,#2b2c31,#101113); box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 0 0 1.5px #3a3b41;
}
.screen{
  position:relative; width:100%; height:100%; border-radius:50px; overflow:hidden; container-type:inline-size;
  background:
    radial-gradient(60% 55% at 12% 8%, #ff9a5a 0%, transparent 60%),
    radial-gradient(55% 60% at 95% 20%, #7a5cff 0%, transparent 62%),
    radial-gradient(70% 60% at 70% 105%, #1ec8b4 0%, transparent 60%),
    #1a1230;
  padding:5.2cqw; display:grid; grid-template-rows:auto 1fr auto; gap:3.2cqw;
}
.screen::before{content:"";position:absolute;inset:0;background:rgba(10,8,22,.28);pointer-events:none}
.screen>*{position:relative}

header{display:flex;justify-content:space-between;align-items:flex-start}
.time{font-size:11cqw;font-weight:200;letter-spacing:-.04em;line-height:.9}
.date{font-size:3.2cqw;color:var(--ink-2);margin-top:1.4cqw;font-weight:500}
.wx{text-align:right}
.wx b{font-size:7cqw;font-weight:300;letter-spacing:-.02em}
.wx span{display:block;font-size:2.8cqw;color:var(--ink-2);margin-top:.4cqw}
.hi{display:none}

main{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:2.4cqw;min-height:0}
.tile{
  background:var(--glass); backdrop-filter:blur(28px) saturate(1.6); -webkit-backdrop-filter:blur(28px) saturate(1.6);
  border-radius:var(--r-md); padding:2.4cqw; display:flex; flex-direction:column; justify-content:space-between;
  border:0; color:inherit; font:inherit; text-align:left; cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); transition:background .25s, color .25s, transform .15s;
}
.tile:active{transform:scale(.97)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tile .ic{width:5.2cqw;height:5.2cqw}
.tile .name{font-size:2.7cqw;font-weight:600;line-height:1.15}
.tile .state{font-size:2.3cqw;color:var(--ink-2);margin-top:.3cqw}
.tile[aria-pressed="true"]{background:var(--glass-on);color:var(--on-ink)}
.tile[aria-pressed="true"] .state{color:rgba(28,28,30,.6)}
.tile[aria-pressed="true"] .ic{color:#e8920a}
.wide{grid-column:span 2}.tall{grid-row:span 2}

/* Thermostat */
.thermo{align-items:center;justify-content:center;gap:1cqw;text-align:center}
.dial{position:relative;width:15cqw;height:15cqw}
.dial svg{width:100%;height:100%;transform:rotate(135deg)}
.dial .val{position:absolute;inset:0;display:grid;place-items:center;font-size:4.6cqw;font-weight:300}
.stepper{display:flex;gap:2cqw}
.stepper button{width:5.6cqw;height:5.6cqw;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:3.4cqw;cursor:pointer}
.stepper button:focus-visible{outline:3px solid #fff}

/* Medien */
.media{flex-direction:row;align-items:center;gap:2cqw;justify-content:flex-start}
.cover{width:9cqw;height:9cqw;border-radius:2cqw;flex:none;background:linear-gradient(135deg,#ff6f91,#845ec2 60%,#2c73d2)}
.media .name{font-size:2.6cqw}
.bars{display:flex;gap:.5cqw;align-items:flex-end;height:2cqw;margin-top:.8cqw}
.bars i{height:30%;width:.5cqw;background:#fff;border-radius:1px;animation:eq 1.1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}.bars i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* Energie */
.energy{gap:.6cqw}.energy .big{font-size:5cqw;font-weight:300;letter-spacing:-.02em}
.spark{width:100%;height:5cqw}

/* Räume */
nav{display:flex;gap:1.6cqw;justify-content:center}
nav button{
  border:0;color:var(--ink-2);background:transparent;font:inherit;font-size:2.6cqw;font-weight:600;
  padding:1.2cqw 2.6cqw;border-radius:99px;cursor:pointer;transition:.2s
}
nav button[aria-current="true"]{background:var(--glass);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
nav button:focus-visible{outline:3px solid #fff}

.legend{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#7d7f88}
@media (prefers-reduced-motion:reduce){.bars i{animation:none;height:70%}.tile{transition:none}}
</style>
</head>
<body>
<div class="device"><div class="screen">

  <header>
    <div>
      <div class="time" id="time">19:42</div>
      <div class="date" id="date">Dienstag, 13. Oktober</div>
      <div class="hi">Willkommen zu Hause</div>
    </div>
    <div class="wx">
      <b>14°</b>
      <span>Leicht bewölkt</span>
      <span>Innen 21,5° · Luft gut</span>
    </div>
  </header>

  <main>
    <!-- Szene -->
    <button class="tile wide" aria-pressed="false" data-on="Aktiv" data-off="Tippen zum Starten">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
      <div><div class="name">Filmabend</div><div class="state">Tippen zum Starten</div></div>
    </button>

    <!-- Thermostat -->
    <div class="tile tall thermo" role="group" aria-label="Wohnzimmer Heizung">
      <div class="name">Wohnzimmer</div>
      <div class="dial">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7" stroke-linecap="round" stroke-dasharray="198 264"/><circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="#ffb340" stroke-width="7" stroke-linecap="round" stroke-dasharray="120 264"/></svg>
        <div class="val"><span id="temp">21,5°</span></div>
      </div>
      <div class="stepper"><button id="minus" aria-label="Kälter">−</button><button id="plus" aria-label="Wärmer">+</button></div>
      <div class="state">Heizt auf 22°</div>
    </div>

    <button class="tile" aria-pressed="true" data-on="An · 60 %" data-off="Aus">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>
      <div><div class="name">Stehlampe</div><div class="state">An · 60 %</div></div>
    </button>

    <button class="tile" aria-pressed="true" data-on="An · Warmweiß" data-off="Aus">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>
      <div><div class="name">Deckenlicht</div><div class="state">An · Warmweiß</div></div>
    </button>

    <button class="tile" aria-pressed="false" data-on="Verriegelt" data-off="Offen">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <div><div class="name">Haustür</div><div class="state">Offen</div></div>
    </button>

    <button class="tile" aria-pressed="false" data-on="Läuft" data-off="Aus">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      <div><div class="name">Ventilator</div><div class="state">Aus</div></div>
    </button>

    <!-- Medien -->
    <div class="tile wide media">
      <div class="cover"></div>
      <div><div class="name">Abendstimmung</div><div class="state">Küche · HomePod</div><div class="bars"><i></i><i></i><i></i><i></i></div></div>
    </div>

    <!-- Energie -->
    <div class="tile wide energy">
      <div class="name">Energie jetzt</div>
      <div class="big">1,2 kW <span style="font-size:2.4cqw;color:var(--ink-2);font-weight:500">Solar deckt 68 %</span></div>
      <svg class="spark" viewBox="0 0 200 30" preserveAspectRatio="none" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"><path d="M0 24 C20 22 30 8 50 10 S80 26 100 16 S130 2 150 8 S185 20 200 12"/></svg>
    </div>
  </main>

  <nav aria-label="Räume">
    <button aria-current="true">Zuhause</button>
    <button>Wohnzimmer</button>
    <button>Küche</button>
    <button>Schlafzimmer</button>
    <button>Außen</button>
  </nav>

</div></div>
<div class="legend">Mockup · Daten sind Platzhalter · Kacheln antippen zum Umschalten</div>

<script>
const pad=n=>String(n).padStart(2,"0");
function tick(){const d=new Date();
  document.getElementById("time").textContent=pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("date").textContent=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});}
tick(); setInterval(tick,30000);

document.querySelectorAll(".tile[aria-pressed]").forEach(t=>{
  const s=t.querySelector(".state");
  t.addEventListener("click",()=>{
    const on=t.getAttribute("aria-pressed")!=="true";
    t.setAttribute("aria-pressed",on); s.textContent=on?t.dataset.on:t.dataset.off;
  });
});

let target=22;
const arc=document.getElementById("arc"),temp=document.getElementById("temp");
function draw(){temp.textContent=target.toFixed(1).replace(".",",")+"°";
  const f=(target-16)/(28-16); arc.setAttribute("stroke-dasharray",(198*f)+" 264");}
document.getElementById("plus").onclick=()=>{target=Math.min(28,target+.5);draw()};
document.getElementById("minus").onclick=()=>{target=Math.max(16,target-.5);draw()};
draw();

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav button").forEach(x=>x.removeAttribute("aria-current"));
  b.setAttribute("aria-current","true");
}));
</script>
</body>
</html>
