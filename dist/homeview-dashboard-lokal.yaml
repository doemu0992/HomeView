# Variante mit Datei: dist/homeview.html nach /homeassistant/www/homeview.html kopieren (= /config/www).
# Kein Token und keine Adresse nötig, HomeView nutzt die Anmeldung von Home Assistant.
# Bei jedem Austausch der Datei die Zahl hinter ?v= erhöhen, sonst zeigt der Browser die alte Datei.
title: HomeView
views:
  - title: HomeView
    path: homeview
    panel: true
    cards:
      - type: iframe
        aspect_ratio: 100%
        allow: fullscreen
        # Optional hinter ?v=4 anhängen: #kiosk=1  und/oder  #chips=1  (z. B. ?v=4#kiosk=1&chips=1)
        url: /local/homeview.html?v=4
