title: HomeView
views:
  - title: HomeView
    path: homeview
    panel: true
    cards:
      - type: iframe
        aspect_ratio: 100%
        allow: fullscreen
        # >>> Nur die zwei Werte hinter dem # am Ende ersetzen: HA-Adresse und Zugriffstoken <<<
        # Optional: "&kiosk=1" am Ende anhängen, dann startet die Anzeige direkt im Kiosk-Modus
        url: "data:text/html;charset=utf-8;base64,#url=http://homeassistant.local:8123&token=DEIN_TOKEN"
