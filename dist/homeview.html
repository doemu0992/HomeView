<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1230">
<title>HomeView</title>
<style>
:root{
--ink:#fff; --ink-2:rgba(255,255,255,.64); --ink-3:rgba(255,255,255,.4);
--glass:rgba(255,255,255,.14); --glass-on:rgba(255,255,255,.93); --on-ink:#1c1c1e;
--amber:#ffb340; --green:#34d399;
/* Alles skaliert mit der kleineren Bildschirmseite: 1rem ≈ 1/52 der Breite (max. Seitenverhältnis 1.4:1) */
font-size:clamp(11px, calc(min(100vw, 150vh) / 60), 26px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
color:var(--ink); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; user-select:none;
font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
background:
radial-gradient(60% 55% at 12% 8%, #ff9a5a 0%, transparent 60%),
radial-gradient(55% 60% at 95% 20%, #7a5cff 0%, transparent 62%),
radial-gradient(70% 60% at 70% 105%, #1ec8b4 0%, transparent 60%),
#1a1230;
background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0;background:rgba(10,8,22,.28);pointer-events:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{
position:relative; height:100%; display:grid; grid-template-rows:auto 1fr auto; gap:1.6rem;
padding:max(2.4rem,env(safe-area-inset-top)) max(2.6rem,env(safe-area-inset-right)) max(1.6rem,env(safe-area-inset-bottom)) max(2.6rem,env(safe-area-inset-left));
}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem}
.time{font-size:5.6rem;font-weight:200;letter-spacing:-.04em;line-height:.95}
.date{font-size:1.5rem;color:var(--ink-2);margin-top:.4rem;font-weight:500}
.wx{text-align:right}
.wx b{font-size:3.2rem;font-weight:300;letter-spacing:-.02em}
.wx span{display:block;font-size:1.3rem;color:var(--ink-2);margin-top:.15rem}
main{
display:grid; gap:1.1rem; min-height:0; overflow-y:auto; scrollbar-width:none; padding:.2rem;
grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr)); grid-auto-rows:9rem; grid-auto-flow:dense;
align-content:start;
}
main::-webkit-scrollbar{display:none}
main{-webkit-mask-image:linear-gradient(#000 calc(100% - 2rem),transparent);mask-image:linear-gradient(#000 calc(100% - 2rem),transparent);padding-bottom:2rem}
main:empty::after{content:"Keine Geräte in diesem Raum";color:var(--ink-2);font-size:1.4rem;grid-column:1/-1;padding:2rem 0}
.tile{
background:var(--glass); backdrop-filter:blur(28px) saturate(1.6); -webkit-backdrop-filter:blur(28px) saturate(1.6);
border-radius:1.6rem; padding:1.2rem 1.3rem; display:flex; flex-direction:column; justify-content:space-between;
border:0; text-align:left; cursor:pointer; min-width:0; touch-action:manipulation;
box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); transition:background .25s,color .25s,transform .15s;
}
.tile:active{transform:scale(.97)}
.tile:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tile .ic{width:2.4rem;height:2.4rem;flex:none}
.tile .name{font-size:1.3rem;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .state{font-size:1.1rem;color:var(--ink-2);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{background:var(--glass-on);color:var(--on-ink)}
.tile.on .state{color:rgba(28,28,30,.62)}
.tile.unavailable{opacity:.45;pointer-events:none}
.tile{container-type:size}
@media (max-width:20rem){.tile{grid-column:span 1!important}}
/* Heizung */
.climate{align-items:center;justify-content:center;gap:.6rem;text-align:center;cursor:default}
.climate .name{-webkit-line-clamp:1}
.dial{position:relative;width:min(100%,8.4rem);aspect-ratio:1}
.dial svg{width:100%;height:100%;transform:rotate(135deg)}
.dial .val{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;font-weight:300}
.stepper{display:flex;gap:1rem}
.stepper button{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:rgba(255,255,255,.2);font-size:1.7rem;line-height:1;cursor:pointer}
.climate.on{background:var(--glass);color:inherit}
/* Medien */
.media{flex-direction:row;align-items:center;justify-content:flex-start;gap:1rem}
.cover{width:4.4rem;height:4.4rem;border-radius:1rem;flex:none;background:linear-gradient(135deg,#ff6f91,#845ec2 60%,#2c73d2) center/cover}
.media>div:last-child{min-width:0}
.bars{display:flex;gap:.2rem;align-items:flex-end;height:1rem;margin-top:.4rem}
.bars i{display:block;width:.22rem;height:30%;background:currentColor;border-radius:1px;animation:eq 1.1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}.bars i:nth-child(4){animation-delay:.1s}
.media:not(.on) .bars{visibility:hidden}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
/* Messwert */
.metric{cursor:default}
.metric .big{font-size:2.6rem;font-weight:300;letter-spacing:-.02em;line-height:1}
.metric .big small{font-size:1.2rem;color:var(--ink-2);font-weight:500;margin-left:.3rem}
nav{display:flex;gap:.7rem;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:.2rem}
nav::-webkit-scrollbar{display:none}
nav button{
border:0;background:transparent;color:var(--ink-2);font-size:1.3rem;font-weight:600;white-space:nowrap;flex:none;
padding:.6rem 1.3rem;border-radius:99px;cursor:pointer;transition:background .2s,color .2s
}
nav button[aria-current="true"]{background:var(--glass);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
/* Quer-/Hochformat */
@media (max-height:34rem){.time{font-size:3.8rem}.wx b{font-size:2.4rem}.wx span:last-child{display:none}.app{gap:1rem}}
@media (orientation:portrait) and (max-width:30rem){.wx span:last-child{display:none}}
/* Einrichtung */
.setup{position:fixed;inset:0;display:grid;place-items:center;padding:1.5rem;z-index:5}
.setup form{width:min(30rem,100%);display:grid;gap:1.1rem;padding:2rem;border-radius:2rem;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);user-select:auto}
.setup h1{font-size:2rem;font-weight:600}
.setup label{display:grid;gap:.4rem;font-size:1.1rem;color:var(--ink-2);font-weight:500}
.setup input{font:inherit;font-size:1.3rem;padding:.8rem 1rem;border-radius:1rem;border:0;background:rgba(0,0,0,.28);color:#fff}
.hint{font-size:1rem;color:var(--ink-3)}
.err{font-size:1.1rem;color:#ff8a80;min-height:1.2em}
.row{display:flex;gap:.8rem;flex-wrap:wrap}
.row button,.sheet-card button{font-size:1.2rem;font-weight:600;padding:.8rem 1.4rem;border-radius:99px;border:0;background:rgba(255,255,255,.18);cursor:pointer}
button.primary{background:#fff!important;color:var(--on-ink)}
/* Detailfenster */
.sheet{position:fixed;inset:0;z-index:8;display:grid;place-items:end center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-card{position:relative;width:min(36rem,100%);max-height:88%;margin:1rem;padding:1.6rem;border-radius:2rem;display:grid;grid-template-rows:auto 1fr;gap:1rem;background:rgba(40,36,60,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.sheet-title{font-size:1.6rem;font-weight:600}
#sheetClose{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:rgba(255,255,255,.18);cursor:pointer;font-size:1.2rem}
.sheet-body{display:grid;gap:1.3rem;overflow-y:auto;scrollbar-width:none;min-height:0;align-content:start}
.sheet-body::-webkit-scrollbar{display:none}
.ctl{display:grid;gap:.5rem}
.ctl-row{display:flex;justify-content:space-between;font-size:1.15rem;color:var(--ink-2);font-weight:500}
.ctl-v{color:#fff;font-variant-numeric:tabular-nums}
.sheet input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:0}
.sheet input[type=range]::-webkit-slider-runnable-track{height:.9rem;border-radius:99px;background:var(--grad,rgba(255,255,255,.22))}
.sheet input[type=range]::-moz-range-track{height:.9rem;border-radius:99px;background:var(--grad,rgba(255,255,255,.22))}
.sheet input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2rem;height:2rem;margin-top:-.55rem;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sheet input[type=range]::-moz-range-thumb{width:2rem;height:2rem;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.seg,.actions,.swatches{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button,.actions button{border:0;border-radius:99px;padding:.65rem 1.2rem;font-size:1.15rem;font-weight:600;background:rgba(255,255,255,.14);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--on-ink)}
.actions button{flex:1 1 auto}
.swatches button{width:2.6rem;height:2.6rem;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);cursor:pointer}
.info{font-size:1.1rem;color:var(--ink-2)}
.more{position:absolute;top:.1rem;right:.3rem;padding:.6rem .8rem;font-size:1.2rem;letter-spacing:.08em;color:var(--ink-3);cursor:pointer;line-height:1}
.tile.on .more{color:rgba(28,28,30,.45)}
.tile{position:relative}
.tile.on .ic{color:var(--tint,#e8920a)}
/* Alarm & Kamera */
.tile.alert{background:rgba(255,69,58,.9);color:#fff;animation:alarm 1s ease-in-out infinite}
.tile.alert .state,.tile.alert .ic{color:#fff}
@keyframes alarm{50%{background:rgba(255,69,58,.5)}}
.camera{padding:0;overflow:hidden;justify-content:flex-end}
.camera img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camera .scrim{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.camera .lbl{position:relative;padding:1rem 1.3rem;color:#fff}
.camera .state{color:rgba(255,255,255,.8)}
.camview{width:100%;aspect-ratio:16/9;max-height:48vh;object-fit:contain;border-radius:1.2rem;background:#000}
.sheet[data-kind=camera] .sheet-card{width:min(54rem,100%)}
.info.big{font-size:1.8rem;color:#fff;text-align:center;font-weight:300}
.info.err{color:#ff8a80;min-height:1.3em;text-align:center}
.pin{text-align:center;font-size:1.6rem;letter-spacing:.4rem;min-height:2.2rem;color:var(--ink-2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:min(18rem,100%);margin:0 auto}
.keypad button{border:0;border-radius:1.2rem;padding:.9rem 0;font-size:1.6rem;background:rgba(255,255,255,.14);cursor:pointer}
.textin{font:inherit;font-size:1.3rem;padding:.8rem 1rem;border-radius:1rem;border:0;background:rgba(0,0,0,.28);color:#fff;user-select:auto}
/* Größenstufen: Inhalt passt sich der Kachelgröße an */
@container (max-height:10rem){
.climate .name,.climate .state{display:none}
.climate .dial{width:4.4rem}.climate .dial .val{font-size:1.4rem}
.climate .stepper button{width:2.2rem;height:2.2rem;font-size:1.4rem}
}
@container (max-width:14rem){
.media{flex-direction:column;align-items:flex-start;justify-content:space-between}
.media .cover{width:3.4rem;height:3.4rem}
.metric .big{font-size:2rem}
}
@container (min-width:20rem) and (min-height:17rem){
.tile:not(.camera):not(.climate) .ic{width:4rem;height:4rem}
.tile:not(.camera):not(.climate) .name{font-size:2rem}
.tile:not(.camera):not(.climate) .state{font-size:1.5rem}
.climate .dial{width:12rem}.climate .dial .val{font-size:3.4rem}
.media .cover{width:9rem;height:9rem}
.metric .big{font-size:4.4rem}
.camera .name{font-size:1.8rem}
}
@container (min-height:17rem) and (max-width:14rem){
.climate .dial{width:8.4rem}.climate .name,.climate .state{display:block}
}
/* Anordnen */
.edit-btn{border:0;border-radius:99px;padding:.6rem 1.3rem;font-size:1.3rem;font-weight:600;background:#fff;color:var(--on-ink);cursor:pointer;flex:none}
.bar{display:flex;align-items:center;gap:1rem;min-width:0}
.bar nav{flex:1;min-width:0}
.editbar{display:flex;gap:.5rem;flex:none}
.edit-btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.editing .tile{animation:jig .3s ease-in-out infinite alternate;cursor:grab;touch-action:none}
.editing .tile:nth-child(2n){animation-direction:alternate-reverse;animation-duration:.26s}
.editing .tile *{pointer-events:none}
.editing .tile .more{display:none}
.editing main{touch-action:none}
.editing .tile.dragging{animation:none;z-index:6;transition:none;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.2);pointer-events:none;cursor:grabbing}
.tile.is-hidden{opacity:.35}
@keyframes jig{from{rotate:-.7deg}to{rotate:.7deg}}
.edit-ctrl{position:absolute;inset:0;pointer-events:none;z-index:2}
.ec-hide,.ec-size{position:absolute;display:grid;place-items:center;background:rgba(20,18,32,.82);color:#fff;font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.ec-hide{top:.5rem;right:.5rem;width:2.2rem;height:2.2rem;border-radius:50%;font-size:1.5rem;line-height:1}
.ec-size{bottom:.5rem;right:.5rem;height:2.1rem;padding:0 .8rem;border-radius:99px;font-size:1.1rem}
.editing .tile .state,.editing .tile .name{text-shadow:none}
.banner{position:fixed;top:.8rem;left:50%;transform:translateX(-50%);z-index:9;padding:.5rem 1.2rem;border-radius:99px;background:rgba(0,0,0,.6);font-size:1.1rem}
@media (prefers-reduced-motion:reduce){.editing .tile{animation:none}.tile.alert{animation:none}.bars i{animation:none;height:70%}.tile{transition:none}}
.editing .climate .name{padding-right:2.4rem}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <header>
    <div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="wx" id="wx"></div>
  </header>
  <main id="grid" aria-live="polite"></main>
  <div class="bar"><nav id="rooms" aria-label="Räume"></nav><div class="editbar" id="editBar"></div></div>
</div>

<div class="setup" id="setup">
  <form id="setupForm">
    <h1>HomeView verbinden</h1>
    <label>Adresse von Home Assistant
      <input id="url" type="url" placeholder="http://homeassistant.local:8123" required>
    </label>
    <label>Langlebiges Zugriffstoken
      <input id="token" type="password" autocomplete="off" required>
    </label>
    <p class="hint">Das Token erstellst du in Home Assistant unter Profil → Sicherheit.</p>
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button type="submit" class="primary">Verbinden</button>
      <button type="button" id="demoBtn">Demo ansehen</button>
    </div>
  </form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle"></div>
      <button id="sheetClose" type="button" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="banner" id="banner" hidden>Verbindung getrennt – verbinde neu …</div>
<script>
"use strict";
/* HomeView – Home-Assistant-Frontend im Stil eines Apple-Home-Displays.
Kein Build-Schritt: spricht direkt die WebSocket-API von Home Assistant.
Tippen schaltet, langes Drücken (oder „···“) öffnet alle Funktionen des Geräts. */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const STORE = "homeview.conn";
const HOME = "__home", OTHER = "__other";
/* ---------- Icons (Linien, 24er Raster) ---------- */
const ICONS = {
light: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/>',
switch: '<path d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/>',
fan: '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7 2.5 0 2.5 3 0 5l-3 2.5M14 12c4 0 7 1 7 4 0 2.5-3 2.5-5 0l-2.5-3M12 14c0 4-1 7-4 7-2.5 0-2.5-3 0-5l3-2.5M10 12c-4 0-7-1-7-4 0-2.5 3-2.5 5 0l2.5 3"/>',
lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
cover: '<path d="M4 4h16M5 4v16M19 4v16M8 8h8M8 12h8M8 16h8"/>',
scene: '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/>',
media: '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
power: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>',
thermo: '<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z"/>',
drop: '<path d="M12 3s6 6.2 6 10.5a6 6 0 0 1-12 0C6 9.200 12 3 12 3Z"/>',
vacuum: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 4v2.5"/>',
door: '<path d="M6 21V4h12v17M4 21h16"/><circle cx="14.500" cy="13" r=".8"/>',
motion: '<circle cx="12" cy="12" r="2"/><path d="M7.800 7.800a6 6 0 0 0 0 8.400M16.200 7.800a6 6 0 0 1 0 8.400M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',
gauge: '<path d="M4 17a8 8 0 1 1 16 0M12 17l4-5"/>',
sliders: '<path d="M5 4v6M5 14v6M12 4v2M12 10v10M19 4v10M19 18v2M3 10h4M10 6h4M17 14h4"/>',
button: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
shield: '<path d="M12 3 5 6v5c0 5 3 8.500 7 10 4-1.500 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
camera: '<path d="M3 7h3l1.500-2h9L18 7h3v12H3Z"/><circle cx="12" cy="13" r="3.500"/>',
list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
};
const icon = k => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
/* ---------- Texte ---------- */
const WEATHER = {
"clear-night": "Klar", cloudy: "Bewölkt", exceptional: "Außergewöhnlich", fog: "Nebel", hail: "Hagel",
lightning: "Gewitter", "lightning-rainy": "Gewitter mit Regen", partlycloudy: "Leicht bewölkt", pouring: "Starkregen",
rainy: "Regen", snowy: "Schnee", "snowy-rainy": "Schneeregen", sunny: "Sonnig", windy: "Windig", "windy-variant": "Windig",
};
const HVAC_ACTION = { heating: "Heizt", cooling: "Kühlt", idle: "Bereit", off: "Aus", drying: "Entfeuchtet", fan: "Lüftet" };
const HVAC_MODE = { off: "Aus", heat: "Heizen", cool: "Kühlen", heat_cool: "Auto", auto: "Automatik", dry: "Trocknen", fan_only: "Lüften" };
const PRESET = { none: "Aus", eco: "Eco", away: "Abwesend", home: "Zuhause", comfort: "Komfort", sleep: "Schlafen", boost: "Boost", activity: "Aktiv" };
const VAC = { cleaning: "Saugt", docked: "In Station", returning: "Fährt zurück", idle: "Bereit", paused: "Pausiert", error: "Fehler" };
const ALARM = { disarmed: "Deaktiviert", armed_home: "Scharf · Zuhause", armed_away: "Scharf · Abwesend", armed_night: "Scharf · Nacht",
armed_vacation: "Scharf · Urlaub", armed_custom_bypass: "Scharf · Benutzerdefiniert", pending: "Wird ausgelöst …", arming: "Schaltet scharf …",
disarming: "Schaltet ab …", triggered: "ALARM" };
const CAM = { idle: "Live-Bild", recording: "Nimmt auf", streaming: "Streamt", off: "Aus" };
let haBase = "";
const camUrl = s => {
const p = s.attributes.entity_picture || "";
if (!p || p.startsWith("data:") || /^https?:/.test(p)) return p;
return haBase + p + (p.includes("?") ? "&" : "?") + "_=" + Date.now();
};
const camStream = s => s.attributes.access_token && haBase
