<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1230">
<title>HomeView</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <header>
    <div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="hright"><div class="wx" id="wx"></div><button id="kioskBtn" type="button" class="kiosk-btn" aria-label="Kiosk-Modus starten"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Kiosk</button></div>
  </header>
  <div class="chips" id="chips" hidden></div>
  <main id="grid" aria-live="polite"></main>
  <div class="bar"><nav id="rooms" aria-label="Räume"></nav><div class="editbar" id="editBar"></div></div>
</div>

<div class="boot" id="boot">HomeView lädt …</div>
<noscript><div class="boot">JavaScript ist deaktiviert.</div></noscript>
<div class="setup" id="setup" hidden>
  <form id="setupForm">
    <h1>HomeView verbinden</h1>
    <label>Adresse von Home Assistant
      <input id="url" type="url" placeholder="http://homeassistant.local:8123" required>
    </label>
    <label>Langlebiges Zugriffstoken
      <input id="token" type="password" autocomplete="off" required>
    </label>
    <p class="hint">Das Token erstellst du in Home Assistant unter Profil → Sicherheit.</p>
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button type="submit" class="primary">Verbinden</button>
      <button type="button" id="demoBtn">Demo ansehen</button>
    </div>
  </form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div class="sheet-ico" id="sheetIco"></div>
      <div class="sheet-titles"><div class="sheet-title" id="sheetTitle"></div><div class="sheet-sub" id="sheetSub"></div></div>
      <button id="sheetClose" type="button" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="banner" id="banner" hidden>Verbindung getrennt – verbinde neu …</div>
<script src="app.js"></script>
</body>
</html>
